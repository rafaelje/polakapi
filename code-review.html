<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/modules/code-review/code-review.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>/code-review</title>
    <script type="module" src="/src/modules/code-review/code-review.ts" defer></script>
  </head>
  <body>
    <main class="code-review-body">
      <header class="code-review-header">
        <div class="code-review-heading">
          <strong>/code-review</strong>
          <span class="code-review-project" id="code-review-project">loading…</span>
          <button
            type="button"
            class="code-review-branch"
            id="code-review-branch"
            aria-haspopup="listbox"
            aria-expanded="false"
            hidden
          ></button>
        </div>
        <div class="code-review-tabs" role="tablist" aria-label="Code review views">
          <button
            type="button"
            class="code-review-tab is-active"
            role="tab"
            data-tab="changes"
            aria-selected="true"
          >
            Changes
          </button>
          <button
            type="button"
            class="code-review-tab"
            role="tab"
            data-tab="branch"
            aria-selected="false"
          >
            Branch
          </button>
        </div>
        <select
          id="code-review-base"
          class="code-review-base"
          aria-label="Base branch"
          title="select the base branch for the diff"
          hidden
        ></select>
        <button
          type="button"
          id="code-review-stage-all"
          class="code-review-btn"
          title="Stage all (a)"
        >
          stage all
        </button>
        <span class="code-review-sync-status" id="code-review-sync-status" role="status"></span>
        <button
          type="button"
          id="code-review-pull"
          class="code-review-btn"
          title="Pull with fast-forward only"
        >
          pull
        </button>
        <button type="button" id="code-review-refresh" class="code-review-btn" title="Refresh (r)">
          refresh
        </button>
      </header>
      <div class="code-review-columns">
        <aside class="code-review-agent" id="code-review-agent" aria-label="Agent">
          <div class="code-review-column-title">agent</div>
          <p class="code-review-empty">The agent terminal will live here.</p>
        </aside>
        <div class="code-review-list-column">
          <section class="code-review-list" id="code-review-list" aria-label="Files"></section>
          <form class="code-review-commit" id="code-review-commit" aria-label="Commit">
            <textarea
              id="code-review-commit-message"
              class="code-review-commit-message"
              rows="3"
              placeholder="Commit message"
              spellcheck="false"
            ></textarea>
            <div class="code-review-commit-actions">
              <span class="code-review-muted" id="code-review-commit-status"></span>
              <button type="submit" id="code-review-commit-button" class="code-review-btn" disabled>
                commit
              </button>
            </div>
          </form>
        </div>
        <section class="code-review-diff" id="code-review-diff" aria-label="Diff">
          <p class="code-review-empty">Select a file to see its diff.</p>
        </section>
      </div>
    </main>
  </body>
</html>
