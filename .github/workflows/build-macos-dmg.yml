name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-dmg:
    name: Universal macOS DMG
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build universal DMG
        run: pnpm tauri build --bundles dmg --target universal-apple-darwin
      - name: Verify DMG
        run: |
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done
      - name: Read release version
        id: release
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "title=PolakAPI v${version}" >> "$GITHUB_OUTPUT"
      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: polakapi-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          dmg_files=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${dmg_files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${dmg_files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --generate-notes
          fi

          release_url=$(gh release view "$RELEASE_TAG" --json url --jq .url)
          echo "[Download the macOS DMG from $RELEASE_TITLE]($release_url)" >> "$GITHUB_STEP_SUMMARY"
